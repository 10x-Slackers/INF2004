<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSC13 car</title>
<style>
  :root {
    --mat: #f3f5f6; --ink: #1a1e23; --rule: #d7dce0; --muted: #65707b;
    --ready: #2e5c8a; --go: #1e7a4c; --caution: #a86a00; --stop: #c1291b;
    --tone: var(--muted);
    font: 15px/1.45 system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    color: var(--ink); background: var(--mat);
  }
  body { margin: 0 auto; padding: 1.25rem 2rem 3rem; max-width: 84rem; }
  h1, h2, .brand {
    font-family: Bahnschrift, "DIN Alternate", "Barlow Semi Condensed",
                 "Roboto Condensed", "Arial Narrow", sans-serif;
    font-stretch: condensed;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  .brand { font-size: 1.15rem; font-weight: 600; }
  #link::before {
    content: ""; display: inline-block; width: .6rem; height: .6rem;
    margin-right: .45rem; border-radius: 50%; background: var(--link, var(--muted));
  }

  /* The state: the one large thing on the page, in its state's colour. */
  .hero {
    display: flex; flex-wrap: wrap; justify-content: space-between;
    align-items: flex-end; gap: 1.5rem; padding: 1.75rem 0 1.5rem;
    border-bottom: 6px solid var(--ink);
  }
  h1 {
    margin: 0; font-size: clamp(2.6rem, 7vw, 5.25rem); line-height: 1;
    font-weight: 700; color: var(--tone); letter-spacing: -.01em;
  }
  #since { margin: .6rem 0 0; color: var(--muted); }
  #hint { margin: .15rem 0 0; }
  .controls { display: grid; grid-template-columns: repeat(3, auto); gap: .6rem; }
  button {
    font: 600 1.05rem/1 system-ui, sans-serif; padding: .9rem 1.6rem;
    border: 2px solid var(--ink); border-radius: 4px;
    background: transparent; color: var(--ink); cursor: pointer;
  }
  button:hover:not(:disabled) { background: #fff; }
  #STOP { background: var(--stop); border-color: var(--stop); color: #fff; padding-inline: 2.4rem; }
  #STOP:hover:not(:disabled) { background: #a32214; }
  button:disabled { opacity: .3; cursor: not-allowed; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--ready); outline-offset: 2px; }
  #notice { grid-column: 1 / -1; margin: 0; min-height: 1.45em; color: var(--muted); font-size: .9rem; text-align: right; }

  main {
    display: grid; gap: 2rem 2.5rem; padding-top: 1.5rem;
    grid-template-columns: repeat(auto-fit, minmax(14.5rem, 1fr));
  }
  h2 { margin: 0 0 .6rem; font-size: 1.1rem; font-weight: 600; }
  dl { display: grid; grid-template-columns: auto auto; gap: .3rem 1rem; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; font-weight: 600; }
  body.stale :is(main, h1) { opacity: .35; }

  /* The two IR sensors over the tape: filled when over black. */
  .sensors { position: relative; height: 3.4rem; margin-bottom: .8rem; }
  .sensors::before {
    content: ""; position: absolute; inset: 0 calc(50% - 1.1rem); background: var(--ink);
  }
  .sensors span {
    position: absolute; top: .95rem; width: 1.5rem; height: 1.5rem; border-radius: 50%;
    border: 2px solid var(--muted); background: var(--mat);
  }
  .sensors span:first-child { left: calc(50% - 2.6rem); }
  .sensors span:last-child { right: calc(50% - 2.6rem); }
  .sensors span.on { background: var(--ink); border-color: var(--go); }

  svg { display: block; width: 100%; max-width: 20rem; margin: 0 auto .6rem; overflow: visible; }
  svg .field { fill: #fff; stroke: var(--rule); }
  svg .ring { fill: none; stroke: var(--rule); stroke-dasharray: 2 3; }
  svg .ray { stroke: var(--ready); stroke-width: 1.5; }
  svg .obstacle { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; }
  svg .closest { fill: var(--stop); }
  svg text { font-size: 7px; fill: var(--muted); }

  #faults { list-style: none; margin: 0 0 .8rem; padding: 0; font-weight: 600; color: var(--stop); }
  #faults:empty::before { content: "No faults"; color: var(--go); }

  .log { margin-top: 2.5rem; }
  .log h2 { display: flex; justify-content: space-between; align-items: baseline; }
  .log a, .log h2 button { font: .9rem system-ui, sans-serif; color: var(--ready); }
  .log h2 button, .log h2 button:hover:not(:disabled) { padding: 0 1rem 0 0; border: 0; background: none; text-decoration: underline; }
  #events { list-style: none; margin: 0; padding: 0; max-height: 22rem; overflow-y: auto; border-top: 1px solid var(--rule); }
  #events li { display: grid; grid-template-columns: 5.5rem 1fr; padding: .35rem 0; border-bottom: 1px solid var(--rule); }
  #events time { color: var(--muted); }
  #events:empty::before { content: "Nothing yet. Events appear here as the car reports them."; display: block; padding: .5rem 0; color: var(--muted); }
  .fault { color: var(--stop); }
  .summary { font-weight: 700; }
  .command { color: var(--ready); }

  @media (max-width: 40rem) {
    body { padding: 1rem; }
    .controls { width: 100%; grid-template-columns: 1fr 1.4fr 1fr; }
  }
</style>

<header>
  <span class="brand">CSC13 car</span>
  <span id="link">Starting</span>
</header>

<section class="hero">
  <div>
    <h1 id="state">Starting</h1>
    <p id="since"></p>
    <p id="hint"></p>
  </div>
  <div class="controls">
    <button type="button" id="START" title="Begin following the line (READY only)">Start</button>
    <button type="button" id="STOP" title="Brake and latch a safe stop (Esc)">Stop</button>
    <button type="button" id="RESET" title="Clear the safe stop (SAFE_STOP only)">Reset</button>
    <p id="notice">Esc sends Stop</p>
  </div>
</section>

<main>
  <section>
    <h2>Line</h2>
    <div class="sensors"><span id="sensor-left"></span><span id="sensor-right"></span></div>
    <dl id="line"></dl>
  </section>
  <section><h2>Motion</h2><dl id="motion"></dl></section>
  <section><h2>Terrain</h2><dl id="terrain"></dl></section>
  <section>
    <h2>Obstacle</h2>
    <svg viewBox="-105 -105 210 112" role="img" aria-label="Range ahead and last obstacle profile">
      <path class="field" d="M0 0 L70.7 -70.7 A100 100 0 0 0 -70.7 -70.7 Z"/>
      <path class="ring" d="M35.4 -35.4 A50 50 0 0 0 -35.4 -35.4"/>
      <text x="40" y="-36">0.3 m</text><text x="75" y="-70">0.6 m</text>
      <line class="ray" id="ray" x1="0" y1="0" x2="0" y2="0"/>
      <path class="obstacle" id="obstacle"/>
      <circle class="closest" id="closest" r="3.5" cx="0" cy="0" visibility="hidden"/>
      <rect x="-6" y="-4" width="12" height="10" rx="2" fill="var(--ink)"/>
    </svg>
    <dl id="obstacle-values"></dl>
  </section>
  <section><h2>Faults</h2><ul id="faults"></ul><dl id="safety"></dl></section>
</main>

<section class="log">
  <h2>Events <span><button type="button" id="clear-log">Clear log</button> <a href="/log" download="car-log.txt">Download log</a></span></h2>
  <ol id="events"></ol>
</section>

<script>
  const STATES = {  // Title, colour, what to do next.
    WAITING: ['Waiting for the car', '--muted', 'Power on the car; its telemetry appears here once it reaches the broker.'],
    INIT: ['Starting up', '--muted', 'Calibrating the IMU. Keep the car still.'],
    READY: ['Ready', '--ready', 'Press Start or GP20 to follow the line.'],
    FOLLOW: ['Following the line', '--go', 'Stop or GP20 ends the run.'],
    AVOID: ['Avoiding an obstacle', '--caution', 'Stop or GP20 ends the run.'],
    TURN: ['Turning at a junction', '--caution', 'Stop or GP20 ends the run.'],
    SAFE_STOP: ['Stopped', '--stop', 'Reset or GP20 clears the stop once the faults allow it, then Start again.'],
  };
  const MOVING = ['READY', 'FOLLOW', 'AVOID', 'TURN'];
  const yes = v => v ? 'yes' : 'no';
  const deg = v => `${(v / 10).toFixed(1)}°`;
  const GROUPS = {  // List id: [label, topic, text from the topic's fields].
    line: [
      ['Junction', 'telemetry', t => yes(t.junction)],
      ['Following', 'telemetry', t => yes(t.following)],
      ['Last barcode', 'telemetry', t => t.barcode],
      ['Barcodes read', 'telemetry', t => t.barcodes],
    ],
    motion: [
      ['Speed left', 'motion', m => `${m.left_speed} mm/s`],
      ['Speed right', 'motion', m => `${m.right_speed} mm/s`],
      ['Distance', 'motion', m => `${(m.distance_mm / 1000).toFixed(2)} m`],
      ['Heading', 'motion', m => `${m.heading_deg}°`],
      ['Move', 'motion', m => `${m.command}, ${m.state}`],
      ['Encoders', 'motion', m => `${m.left_count} / ${m.right_count}`],
    ],
    terrain: [
      ['Pitch', 'telemetry', t => deg(t.pitch)],
      ['Roll', 'telemetry', t => deg(t.roll)],
      ['Motion', 'telemetry', t => t.motion_class],
      ['Highest hump this run', 'telemetry', t => `${t.hump_max} mm`],
      ['Humps', 'telemetry', t => t.humps],
      ['On a hump', 'telemetry', t => yes(t.on_hump)],
    ],
    'obstacle-values': [
      ['Ahead', 'telemetry', t => t.forward_mm >= 4000 ? 'clear' : `${t.forward_mm} mm`],
      ['Avoidance', 'telemetry', t => t.avoid_state],
      ['Bypass side', 'telemetry', t => t.avoid_side],
      ['Bypasses', 'telemetry', t => t.bypasses],
      ['Closest', 'scan', s => `${s.closest_mm} mm at ${s.closest_deg}°`],
      ['Width', 'scan', s => `${s.width_mm} mm`],
      ['Clearance left', 'scan', s => `${s.left_mm} mm`],
      ['Clearance right', 'scan', s => `${s.right_mm} mm`],
    ],
    safety: [['Safety latch', 'telemetry', t => t.latched ? 'held' : 'clear']],
  };
  const $ = id => document.getElementById(id);
  let stateName = null, stateSince = 0, lastEvent = 0, run = null;

  // One <dt>/<dd> per field, made once; refresh() fills in the <dd>.
  for (const [id, fields] of Object.entries(GROUPS)) {
    for (const field of fields) {
      const dt = document.createElement('dt'), dd = document.createElement('dd');
      dt.textContent = field[0];
      dd.textContent = '–';
      field.push(dd);
      $(id).append(dt, dd);
    }
  }

  // A point at a servo angle (90 is straight ahead, larger is left) and a
  // range, scaled so 0.6 m (obstacles are profiled closer) is the fan's edge.
  const radius = mm => Math.min(mm, 600) / 6;
  function point(angle, mm) {
    const r = radius(mm), a = angle * Math.PI / 180;
    return [(r * Math.cos(a)).toFixed(1), (-r * Math.sin(a)).toFixed(1)];
  }

  function showScan(t, s) {
    const [x, y] = point(90, t ? t.forward_mm : 0);
    $('ray').setAttribute('x2', x);
    $('ray').setAttribute('y2', y);
    if (!s) return;
    const r = radius(s.closest_mm);
    $('obstacle').setAttribute('d', `M${point(s.right_deg, s.closest_mm)} ` +
      `A${r} ${r} 0 0 0 ${point(s.left_deg, s.closest_mm)}`);
    const [cx, cy] = point(s.closest_deg, s.closest_mm);
    $('closest').setAttribute('cx', cx);
    $('closest').setAttribute('cy', cy);
    $('closest').setAttribute('visibility', 'visible');
  }

  function showState(t, age, broker, carOnline) {
    const name = t ? t.state : null;
    if (name !== stateName) { stateName = name; stateSince = Date.now(); }
    const [title, tone, hint] = STATES[name] || STATES.WAITING;
    const stale = !t || age > 1.5;
    $('state').textContent = title;
    document.documentElement.style.setProperty('--tone', `var(${tone})`);
    $('since').textContent = name ? `${name} for ${Math.round((Date.now() - stateSince) / 1000)} s` : '';
    $('hint').textContent = !broker ? 'The dashboard has no broker connection. Check --broker and that Mosquitto is running.'
      : t && stale ? `No telemetry for ${Math.round(age)} s. Check the car is on and on the broker's network.`
      : hint;
    document.body.classList.toggle('stale', stale);
    const off = !broker || !carOnline;  // A command would reach no one.
    $('START').disabled = off || name !== 'READY';
    $('RESET').disabled = off || name !== 'SAFE_STOP';
    $('STOP').disabled = off || !MOVING.includes(name);
  }

  // Newest first; the server sends only the events after lastEvent.
  function showEvents(events) {
    if (!events.length) return;
    lastEvent = events.at(-1).id;
    $('events').prepend(...events.reverse().map(e => {
      const li = document.createElement('li'), time = document.createElement('time');
      time.textContent = new Date(e.t * 1000).toLocaleTimeString([], {hour12: false});
      li.className = e.kind;
      li.append(time, e.text);
      return li;
    }));
    while ($('events').children.length > 200) $('events').lastChild.remove();
  }

  async function refresh() {
    let data;
    try {
      data = await (await fetch(`/state?since=${lastEvent}`)).json();
    } catch {
      $('link').textContent = 'Dashboard server stopped';
      document.documentElement.style.setProperty('--link', 'var(--stop)');
      return;
    }
    const topic = name => data.topics[name] || {};
    const t = topic('telemetry').values, age = topic('telemetry').age_s;
    const beat = topic('heartbeat').age_s, carOnline = beat !== undefined && beat < 2.5;
    $('link').textContent = !data.broker ? 'No broker'
      : beat === undefined ? 'Waiting for a heartbeat'
      : carOnline ? `Car online, heartbeat ${beat.toFixed(1)} s ago`
      : `Car offline, last heard ${Math.round(beat)} s ago`;
    document.documentElement.style.setProperty('--link',
      carOnline && data.broker ? 'var(--go)' : 'var(--stop)');

    showState(t, age, data.broker, carOnline);
    for (const fields of Object.values(GROUPS)) {
      for (const [, name, text, dd] of fields) {
        const values = topic(name).values;
        dd.textContent = values ? text(values) : '–';
      }
    }
    $('sensor-left').classList.toggle('on', !!t && (t.line & 1) !== 0);
    $('sensor-right').classList.toggle('on', !!t && (t.line & 2) !== 0);
    $('faults').replaceChildren(...(t ? t.faults : []).map(f => {
      const li = document.createElement('li');
      li.textContent = f.toLowerCase().replaceAll('_', ' ');
      return li;
    }));
    showScan(t, topic('scan').values);
    if (data.run !== run) {  // A new server: its ids start from 1 again.
      run = data.run;
      lastEvent = 0;
      $('events').replaceChildren();
    } else {
      showEvents(data.events);
    }
  }

  async function send(name) {
    const response = await fetch(`/cmd/${name}`, {method: 'POST'}).catch(() => null);
    $('notice').textContent = !response ? 'Not sent: the dashboard server stopped'
      : response.ok ? `Sent ${name[0] + name.slice(1).toLowerCase()}` : await response.text();
  }

  for (const id of ['START', 'STOP', 'RESET']) $(id).onclick = () => send(id);
  $('clear-log').onclick = async () => {
    await fetch('/clear', {method: 'POST'}).catch(() => null);
    $('events').replaceChildren();
  };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('STOP').disabled) send('STOP');
  });
  // One request at a time, so two never fetch the same new events.
  (async function poll() {
    await refresh();
    setTimeout(poll, 250);
  })();
</script>
</html>
