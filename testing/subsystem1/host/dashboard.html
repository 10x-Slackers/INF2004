<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>CSC13 supervisor</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.4 system-ui, sans-serif; }
  body { margin: 1.5rem; }
  h1 { font-size: 1.3rem; margin: 0 0 1rem; }
  h2 { font-size: 1rem; margin: 0 0 .4rem; }
  small { font-weight: normal; opacity: .6; }
  button { font: inherit; font-weight: 600; padding: .5rem 1.4rem; margin-right: .5rem; cursor: pointer; }
  #STOP { background: #c62828; color: #fff; border-color: #c62828; }
  main { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1.2rem; align-items: flex-start; }
  section { border: 1px solid #8886; border-radius: 6px; padding: .8rem 1rem; min-width: 14rem; }
  section.stale { opacity: .45; }
  th { text-align: left; font-weight: normal; padding-right: 1.2rem; }
  td { font-family: ui-monospace, monospace; text-align: right; }
</style>
<h1>CSC13 supervisor <small id="broker"></small></h1>
<button id="START">START</button><button id="STOP">STOP</button><button id="RESET">RESET</button>
<main id="topics"></main>
<script>
  const PERIODIC = ['telemetry', 'motion', 'heartbeat'];  // Stale when 2 s old.

  for (const button of document.querySelectorAll('button')) {
    button.onclick = () => fetch('/cmd/' + button.id, {method: 'POST'});
  }

  async function refresh() {
    const state = await (await fetch('/state')).json();
    document.getElementById('broker').textContent =
      state.broker ? 'broker connected' : 'broker not connected';
    document.getElementById('topics').innerHTML = Object.entries(state.topics).map(
      ([name, topic]) => `
        <section class="${PERIODIC.includes(name) && topic.age_s > 2 ? 'stale' : ''}">
          <h2>${name} <small>${topic.age_s} s ago</small></h2>
          <table>${Object.entries(topic.values).map(([field, value]) =>
            `<tr><th>${field}</th><td>${[].concat(value).join(' ') || '-'}</td></tr>`).join('')}
          </table>
        </section>`).join('');
  }

  setInterval(refresh, 500);
  refresh();
</script>
</html>
